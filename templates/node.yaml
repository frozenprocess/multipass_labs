package_update: true
packages:
  - conntrack
users:
  - default
ca_certs:
  trusted:
    - registry_ca_crt
    - |
{{CA_CRT}}
write_files:
- encoding: b64
  content: {{PREPARE}}
  owner: root:root
  path: /root/prepare.sh
- encoding: b64
  content: {{NODE}}
  owner: root:root
  path: /root/node.sh
- encoding: b64
  content: {{INSTALL}}
  owner: root:root
  path: /root/install.sh
ssh_keys:
  rsa_private: |
{{SSH_KEY}}

  rsa_public: {{SSH_KEY_PUB}}

runcmd:
  - [ /usr/bin/chmod, +x, /root/prepare.sh]
  - [ /root/prepare.sh ]
  - [ /usr/bin/chmod, +x, /root/node.sh ]
  - [ /root/node.sh ]
  - [ /usr/bin/chmod, +x, /root/install.sh ]
  - [ /root/install.sh ]
  - [ /usr/bin/chown, -R, ubuntu:ubuntu, /home/ubuntu ]

power_state:
  mode: reboot